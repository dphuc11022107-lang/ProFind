<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết công việc</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="./asset/css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="detail-container">

        <h1 id="title"></h1>

        <p class="company-name">
            <i class="fa-solid fa-building"></i>
            <span id="company"></span>
        </p>

        <div class="job-sticker">

            <span>
                <i class="fa-solid fa-money-bill-wave"></i>
                <span id="salary"></span>
            </span>

            <span>
                <i class="fa-solid fa-location-dot"></i>
                <span id="location"></span>
            </span>

            <span>
                <i class="fa-solid fa-briefcase"></i>
                <span id="type"></span>
            </span>

            <span>
                <i class="fa-solid fa-layer-group"></i>
                <span id="category"></span>
            </span>

        </div>

        <div class="detail-box description-box">

            <div class="section-title">
                <i class="fa-solid fa-file-lines"></i>
                <h3>Mô tả công việc</h3>
            </div>

            <div class="description-content">
                <p id="description"></p>
            </div>

        </div>
        <div class="detail-box requirement-box">

            <div class="section-title">
                <i class="fa-solid fa-circle-check"></i>
                <h3>Yêu cầu ứng viên</h3>
            </div>

            <div class="requirement-content">
                <p id="requirement"></p>
            </div>

        </div>
        <button class="btn" onclick="moFormUngTuyen()">
            <i class="fa-solid fa-file-signature"></i> Ứng tuyển
        </button>
        <!-- Popup Apply -->
        <div id="applyPopup" class="popup">
            <div class="form-apply">
                <span class="close" onclick="dongFormUngTuyen()">&times;</span>
                <h2 class="form-title"><i class="fa-solid fa-file-signature"></i> Ứng tuyển</h2>
                <form id="applyForm">
                    <!-- <div class="upload-box">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <h4>Tải CV từ máy tính</h4>
                        <p>Hỗ trợ định dạng .doc, .docx, .pdf (tối đa 5MB)</p>
                        <input type="file" id="cv" hidden>
                        <label for="cv" class="upload-btn">
                            Chọn CV
                        </label>
                    </div>
        
                    <div class="info-header">
                        <span class="info-left">
                            Vui lòng nhập đầy đủ thông tin chi tiết:
                        </span>
        
                        <span class="info-right">
                            (*) Thông tin bắt buộc
                        </span>
                    </div> -->
                    <div class="form-group">
                        <label>Họ và tên <span style="color:red">*</span></label>
                        <input type="text" id="name" class="form-control" placeholder="Nhập họ và tên">
                        <small id="nameError" class="error"></small>
                    </div>

                    <div class="row">

                        <div class="form-group">
                            <div class="form-group">
                                <label>Email <span style="color:red">*</span></label>
                                <input type="email" id="email" class="form-control" placeholder="Nhập email">
                                <small id="emailError" class="error"></small>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-group">
                                <label>Số điện thoại <span style="color:red">*</span></label>
                                <input type="text" id="phone" class="form-control" placeholder="Nhập số điện thoại">
                                <small id="phoneError" class="error"></small>
                            </div>
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Vị trí ứng tuyển <span style="color:red">*</span></label>

                        <input type="text" id="job" class="form-control">

                        <small id="jobError" class="error"></small>
                    </div>

                    <div class="form-group">
                        <label>Giới thiệu bản thân</label>

                        <textarea id="note" class="form-control"
                            placeholder="Giới thiệu đôi nét về bản thân"></textarea>

                        <small id="noteError" class="error"></small>
                    </div>

                    <div class="note-text">
                        <p>
                            <span class="note">
                                <i class="fa-solid fa-circle-info" style="color:red"></i>
                                Lưu ý:
                            </span>
                        </p>

                        <p>
                            ProFIND khuyên tất cả ứng viên nên tìm hiểu kỹ doanh nghiệp trước khi ứng tuyển.
                            Nếu phát hiện tin tuyển dụng không đúng, vui lòng liên hệ qua
                            <u>contact@profind.com</u>.
                        </p>
                    </div>

                    <button type="submit" class="btn">
                        <i class="fa-solid fa-paper-plane"></i>
                        Gửi đơn
                    </button>

                </form>
            </div>
        </div>

        <div id="successPopup" class="popup">
            <div class="success-content">
                <h3><i class="fa-solid fa-circle-check"></i> Gửi thành công!</h3>
                <p>Đơn ứng tuyển của bạn đã được gửi thành công.</p>
                <button onclick="closePopup()">
                    Đóng
                </button>
            </div>
        </div>
    </div>
    <script src="./asset/job.js"></script>
    <script src="./asset/js.js"></script>

</body>

</html>
