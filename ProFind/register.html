<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./asset/css.css">
</head>

<body class="auth-page">


    <div class="auth-box">

        <h2 class="auth-title">
            Đăng ký
        </h2>


        <p class="auth-subtitle">
            Tạo tài khoản miễn phí, tìm kiếm việc làm
        </p>



        <div class="auth-group">
            <label>Họ tên</label>

            <input type="text" id="registerName">

            <small class="error" id="registerNameError"></small>
        </div>




        <div class="auth-group">

            <label>Email</label>

            <input type="email" id="registerEmail">

            <small class="error" id="registerEmailError"></small>

        </div>





        <div class="auth-group">

            <label>Mật khẩu</label>

            <input type="password" id="registerPassword">

            <small class="error" id="registerPasswordError"></small>

        </div>





        <div class="auth-group">

            <label>Xác nhận mật khẩu</label>

            <input type="password" id="registerConfirmPassword">

            <small class="error" id="registerConfirmPasswordError"></small>

        </div>





        <button class="auth-btn" onclick="dangKy()">

            Đăng ký

        </button>




        <div class="auth-link">

            Đã có tài khoản?

            <a href="login.html">
                Đăng nhập
            </a>

        </div>


    </div>




    <div id="messagePopup" class="popup-contact">

        <div class="popup-content">

            <h3 id="popupTitle"></h3>

            <p id="popupText"></p>


            <button onclick="dongThongBao()">
                Đóng
            </button>


        </div>

    </div>




    <script src="./asset/js.js"></script>


</body>

</html>
